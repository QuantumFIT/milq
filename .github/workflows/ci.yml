name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      # yices2 and cvc5 are used from solvers/; gurobipy ships a size-limited license
      - name: Run tests with coverage
        run: pytest -v -rxs --cov --cov-report=xml --cov-report=term

      # keeps the numbers visible on the run page even without Codecov
      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # best-effort until the repository is activated on Codecov and CODECOV_TOKEN
      # is set; flip fail_ci_if_error to true once uploads are expected to work
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
