name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }}, ${{ matrix.versions }} dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # the newest releases allowed by requirements.txt; this job reports coverage
          - python: "3.12"
            versions: newest
            coverage: true
          # the oldest supported Python with the lowest releases allowed by requirements.txt
          - python: "3.11"
            versions: lowest
          - python: "3.14"
            versions: newest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      # lowest: every `>=x` lower bound of requirements.txt pinned to `==x`. The size-limited license that comes
      # with gurobipy expires about two years after its major release (13.x on 2027-11-29). Where CI falls back to
      # it (see below), the gurobipy floor has to be raised before then, or the Gurobi tests of this job fail with
      # "License expired".
      - name: Install dependencies
        run: |
          if [ "${{ matrix.versions }}" = lowest ]; then
            sed -E 's/>=([^,;[:space:]]+).*/==\1/' requirements.txt > requirements-lowest.txt
            cat requirements-lowest.txt
            pip install -r requirements-lowest.txt pytest pytest-cov
          else
            pip install -r requirements.txt pytest pytest-cov
          fi
          pip freeze

      # The organization secret GUROBI_LICENSE holds the contents of a gurobi.lic file. It is used only if it
      # works as a full license here: it can be missing (Dependabot and pull requests from forks get no
      # secrets), invalid, expired, or tied to another machine. Otherwise gurobipy keeps the size-limited
      # license it ships with.
      - name: Set up the Gurobi license
        env:
          GUROBI_LICENSE: ${{ secrets.GUROBI_LICENSE }}
        run: |
          license="$RUNNER_TEMP/gurobi.lic"
          if [ -z "$GUROBI_LICENSE" ]; then
            echo "::notice::No GUROBI_LICENSE secret: the tests use the size-limited license shipped with gurobipy"
            exit 0
          fi
          (umask 077 && printf '%s\n' "$GUROBI_LICENSE" > "$license")
          # more variables than the size-limited license allows: only a full license can solve this
          if GRB_LICENSE_FILE="$license" python - <<'PY'
          import gurobipy as gp
          with gp.Env(params={"OutputFlag": 0}) as env, gp.Model(env=env) as model:
              model.addVars(2001)
              model.optimize()
          PY
          then
            echo "GRB_LICENSE_FILE=$license" >> "$GITHUB_ENV"
            echo "::notice::The tests use the Gurobi license from GUROBI_LICENSE"
          else
            rm -f "$license"
            echo "::warning::GUROBI_LICENSE is not a working full Gurobi license here: the tests use the size-limited license shipped with gurobipy"
          fi

      # The tests use the SMT solvers that configure-solvers finds: z3 from z3-solver, and the yices2, cvc5 and
      # OpenSMT release binaries it downloads into solvers/ (checking their sha256). This prints what they find.
      - name: Download SMT solvers
        run: ./configure-solvers --download -o -

      - name: Run tests with coverage
        run: pytest -v -rxs --cov --cov-report=xml --cov-report=term

      # keeps the numbers visible on the run page even without Codecov
      - name: Coverage summary
        if: always() && matrix.coverage
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # best-effort until the repository is activated on Codecov and CODECOV_TOKEN
      # is set; flip fail_ci_if_error to true once uploads are expected to work
      - name: Upload to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
